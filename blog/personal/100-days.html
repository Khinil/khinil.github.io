<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>100 Days Challenge | Khinil Sahu</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../../style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .story-page {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .story-viewer {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            position: relative;
            background: #111;
            overflow: hidden;
        }

        /* Back button */
        .back-personal {
            position: absolute;
            top: 22px;
            left: 25px;
            z-index: 20;

            color: #fff;
            text-decoration: none;
            font-size: 15px;

            background: rgba(0, 0, 0, 0.55);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        .back-personal:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Story progress */
        .story-progress {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 55%;
            max-width: 650px;

            display: flex;
            gap: 5px;

            z-index: 20;
        }

        .progress-segment {
            height: 3px;
            flex: 1;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.35);
        }

        .progress-segment.active {
            background: #fff;
        }

        /* Main content */
        .story-content {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 60% 40%;
        }

        /* Photo */
        .photo-section {
            position: relative;
            min-height: 100vh;
            background: #050505;
            overflow: hidden;
        }

        .story-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-counter {
            position: absolute;
            top: 35px;
            right: 25px;

            background: rgba(0, 0, 0, 0.55);
            padding: 7px 12px;
            border-radius: 20px;

            font-size: 13px;
            z-index: 10;
        }

        /* Skipped day */
        .skipped-message {
            position: absolute;
            inset: 0;

            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            background: #111;
        }

        .skipped-icon {
            font-size: 50px;
            margin-bottom: 15px;
            opacity: 0.7;
        }

        .skipped-title {
            font-size: 28px;
            font-weight: 600;
        }

        .skipped-subtitle {
            margin-top: 8px;
            color: #999;
            font-size: 15px;
        }

        /* Tap zones */
        .tap-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 35%;
            z-index: 5;
        }

        .tap-left {
            left: 0;
        }

        .tap-right {
            right: 0;
        }

        /* Text section */
        .text-section {
            padding: 100px 55px 50px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            background: #111;
        }

        .day-number {
            font-size: 14px;
            letter-spacing: 2px;
            color: #aaa;
            margin-bottom: 12px;
        }

        .text-section h1 {
            font-size: clamp(32px, 4vw, 55px);
            line-height: 1.1;
            margin: 0 0 10px;
        }

        .date {
            color: #888;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .thought {
            font-size: 21px;
            line-height: 1.65;
            color: #eee;
            margin-bottom: 35px;
        }

        .photography-credit {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }

        .location {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 35px;
        }

        .location i {
            margin-right: 5px;
        }

        .day-progress {
            color: #777;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* Navigation */
        .navigation {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            border: 1px solid #444;
            background: transparent;
            color: #fff;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: 0.2s;
        }

        .nav-btn:hover {
            background: #fff;
            color: #000;
        }

        /* Animations */
        .slide-next {
            animation: slideNext 0.35s ease;
        }

        .slide-prev {
            animation: slidePrev 0.35s ease;
        }

        @keyframes slideNext {
            from {
                opacity: 0;
                transform: translateX(35px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slidePrev {
            from {
                opacity: 0;
                transform: translateX(-35px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Mobile */
        @media (max-width: 768px) {

            .story-content {
                display: flex;
                flex-direction: column;
            }

            .photo-section {
                min-height: 65vh;
                height: 65vh;
            }

            .story-photo {
                object-fit: cover;
            }

            .story-progress {
                width: 70%;
                top: 12px;
            }

            .back-personal {
                top: 25px;
                left: 15px;
                font-size: 13px;
            }

            .photo-counter {
                top: 48px;
                right: 15px;
                font-size: 12px;
            }

            .text-section {
                min-height: 35vh;
                padding: 25px 22px 35px;
                justify-content: flex-start;
            }

            .day-number {
                font-size: 12px;
            }

            .text-section h1 {
                font-size: 30px;
            }

            .date {
                margin-bottom: 20px;
            }

            .thought {
                font-size: 17px;
                line-height: 1.55;
                margin-bottom: 22px;
            }

            .photography-credit {
                font-size: 13px;
            }

            .location {
                font-size: 13px;
                margin-bottom: 20px;
            }

            .day-progress {
                display: none;
            }

            .navigation {
                display: none;
            }

            .skipped-title {
                font-size: 25px;
            }
        }
    </style>
</head>


<body>

    <div class="story-page">

        <div class="story-viewer">

            <!-- Back -->
            <a href="index.html" class="back-personal">
                <i class="bi bi-arrow-left"></i>
                Personal
            </a>


            <!-- Progress -->
            <div id="storyProgress" class="story-progress"></div>


            <div class="story-content">

                <!-- PHOTO SIDE -->
                <div class="photo-section" id="photoSection">

                    <img
                        id="storyPhoto"
                        class="story-photo"
                        src=""
                        alt="100 Days Challenge">

                    <!-- Skipped Day -->
                    <div
                        id="skippedMessage"
                        class="skipped-message">

                        <div class="skipped-icon">
                            ⏸
                        </div>

                        <div class="skipped-title">
                            Day Skipped
                        </div>

                        <div class="skipped-subtitle">
                            No entry for this day
                        </div>

                    </div>


                    <!-- Photo counter -->
                    <div
                        id="photoCounter"
                        class="photo-counter">
                    </div>


                    <!-- Tap areas -->
                    <div
                        class="tap-zone tap-left"
                        onclick="previous()">
                    </div>

                    <div
                        class="tap-zone tap-right"
                        onclick="next()">
                    </div>

                </div>


                <!-- TEXT SIDE -->
                <div class="text-section">

                    <div
                        id="dayNumber"
                        class="day-number">
                    </div>

                    <h1 id="dayTitle"></h1>

                    <div
                        id="dayDate"
                        class="date">
                    </div>

                    <div
                        id="dayThought"
                        class="thought">
                    </div>
<div
    id="dayQuote" class="quote-note">
    
    </div>
                    <div
                        id="photographyCredit"
                        class="photography-credit">
                    </div>

                    <div
                        id="dayLocation"
                        class="location">
                    </div>

                    <div
                        id="dayProgress"
                        class="day-progress">
                    </div>


                    <!-- Navigation -->
                    <div class="navigation">

                        <button
                            class="nav-btn"
                            onclick="previous()"
                            aria-label="Previous">

                            <i class="bi bi-chevron-left"></i>

                        </button>


                        <button
                            class="nav-btn"
                            onclick="next()"
                            aria-label="Next">

                            <i class="bi bi-chevron-right"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script>

        /* =========================
           DAYS DATA
        ========================= */

        const days = [

            {
                day: 1,
                date: "26 September 2026",
                title: "The Beginning",

                photos: [
                    "photos/day1.jpg"
                ],

                thought:
                    "Kahin pahunchne ke liye, kahin se nikalna bahut zaroori hai.",

                photographer:
                    "Mr. Rakesh, IIT Bhubaneswar",

                location:
                    "IIT Bhubaneswar"
            },


            {
                day: 2,
                date: "27 September 2026",
                title: "A Skipped Day",

                photos: [],

                thought:
                    "Progress isn’t about being perfect; it’s about starting again.",

                photographer:
                    "",

                location:
                    ""
            },


            {
                day: 3,
                date: "28 September 2026",
                title: "Restart",

                photos: [
                    "photos/day3.jpg"
                ],

                thought:
                    "Don’t waste more days regretting one skipped day. Take 2–3 minutes to reflect, reset, and restart with higher energy. One missed day doesn’t have to affect the days that follow.",

                photographer:
                    "Mr. Rakesh, IIT Bhubaneswar",

                location:
                    "IIT Bhubaneswar"
            },
            

{
    day: 4,
    date: "29 September 2026",
    title: "500 Stairs",

    photos: [
        "photos/day4.jpg"
    ],

    thought:
        "I couldn’t hit the gym today. I thought the day was already over. But at night, I remembered—I still had some time. I didn’t need a perfect day; I just needed to do something. So, 500 stairs in 10 minutes.The day isn’t over until you decide it is. Even one small effort can turn a missed day into a meaningful one.",

    quote:
        "The day isn’t over until you decide it is. Even one small effort can turn a missed day into a meaningful one.",

    photographer:
        "",

    location:
        "IIT Bhubaneswar"
},
            {
    day: 5,
    date: "30 September 2026",
    title: "A Silent Day",

    photos: [],

    thought:
        "A busy day. No photo, no big achievement to record. Just work, responsibilities, and a lot going on in the background. Some days are loud with progress; some days are simply about keeping going.",

    quote:
        "Not every day needs to be remarkable. Some days are simply meant to be lived.",

    photographer:
        "",

    location:
        ""
},
            {
    day: 6,
    date: "1 October 2026",
    title: "A Mixed Day",

    photos: [],

    thought:
        "A mixed day. Some things went well, some didn’t. Not every day has a clear story, but every day leaves something to learn from.",

    location:
        ""
},

{
    day: 7,
    date: "2 October 2026",
    title: "Deep Work",

    photos: [],

    thought:
        "6–7 hours of productive work in the lab. A day of staying focused, solving problems, and slowly moving forward.",

    location:
        "IIT Bhubaneswar"
},

{
    day: 8,
    date: "3 October 2026",
    title: "Unexplored Potential",

    photos: ["photos/day8.gif.gif"],

    thought:
        "Another productive second half in the lab—around 4–5 hours of focused work. It made me think about how many people go through life without ever discovering what they are truly capable of. They never explore their potential, simply because they never give themselves the chance to try.",

    quote:
        "Many people leave this world without ever discovering what they were truly capable of. Your potential is something you have to explore.",

    location:
        "IIT Bhubaneswar"
}
            
        ];


        /* =========================
           VARIABLES
        ========================= */

        let currentDay = 0;
        let currentPhoto = 0;


        const storyPhoto =
            document.getElementById("storyPhoto");

        const skippedMessage =
            document.getElementById("skippedMessage");

        const photoCounter =
            document.getElementById("photoCounter");

        const dayNumber =
            document.getElementById("dayNumber");

        const dayTitle =
            document.getElementById("dayTitle");

        const dayDate =
            document.getElementById("dayDate");

        const dayThought =
            document.getElementById("dayThought");

        const photographyCredit =
            document.getElementById("photographyCredit");

        const dayLocation =
            document.getElementById("dayLocation");

        const dayProgress =
            document.getElementById("dayProgress");

        const storyProgress =
            document.getElementById("storyProgress");
const dayQuote = 
    document.getElementById("dayQuote");

        /* =========================
           RENDER DAY
        ========================= */

        function render(direction = "next") {

            const day = days[currentDay];


            /* Remove old animation */
            storyPhoto.classList.remove(
                "slide-next",
                "slide-prev"
            );


            /* Day information */

            dayNumber.textContent =
                "DAY " +
                String(day.day).padStart(2, "0") +
                " / 100";

            dayTitle.textContent =
                day.title;

            dayDate.textContent =
                day.date;

            dayThought.textContent =
                day.thought;

            dayProgress.textContent =
                "Day " +
                day.day +
                " of 100";
dayThought.textContent =
    day.thought;

dayQuote.textContent = day.quote
    ? "“" + day.quote + "”"
    : "";

dayQuote.style.display =
    day.quote ? "block" : "none";

            /* =========================
               PHOTO DAY
            ========================= */

            if (day.photos.length > 0) {

                storyPhoto.style.display =
                    "block";

                skippedMessage.style.display =
                    "none";


                storyPhoto.src =
                    day.photos[currentPhoto];


                photoCounter.textContent =
                    (currentPhoto + 1) +
                    " / " +
                    day.photos.length;


                if (direction === "next") {

                    storyPhoto.classList.add(
                        "slide-next"
                    );

                } else {

                    storyPhoto.classList.add(
                        "slide-prev"
                    );

                }


                /* Photography */

                if (day.photographer) {

                    photographyCredit.style.display =
                        "block";

                    photographyCredit.textContent =
                        "📷 Photography: " +
                        day.photographer;

                } else {

                    photographyCredit.style.display =
                        "none";

                }


                /* Location */

                if (day.location) {

                    dayLocation.style.display =
                        "block";

                    dayLocation.innerHTML =
                        '<i class="bi bi-geo-alt-fill"></i> ' +
                        day.location;

                } else {

                    dayLocation.style.display =
                        "none";

                }

            }


            /* =========================
               SKIPPED DAY
            ========================= */

            else {

                storyPhoto.style.display =
                    "none";

                storyPhoto.removeAttribute("src");


                skippedMessage.style.display =
                    "flex";


                photoCounter.textContent =
                    "SKIPPED";


                photographyCredit.style.display =
                    "none";

                dayLocation.style.display =
                    "none";

            }


            updateProgress();
        }


        /* =========================
           STORY PROGRESS
        ========================= */

        function updateProgress() {

            storyProgress.innerHTML = "";

            const day = days[currentDay];

            const count =
                Math.max(day.photos.length, 1);


            for (
                let i = 0;
                i < count;
                i++
            ) {

                const segment =
                    document.createElement("div");

                segment.className =
                    "progress-segment";


                if (
                    day.photos.length === 0 ||
                    i === currentPhoto
                ) {

                    segment.classList.add(
                        "active"
                    );

                }


                storyProgress.appendChild(
                    segment
                );
            }
        }


        /* =========================
           NEXT
        ========================= */

        function next() {

            const day = days[currentDay];


            /* More photos in same day */

            if (
                day.photos.length > 0 &&
                currentPhoto <
                day.photos.length - 1
            ) {

                currentPhoto++;

            }


            /* Next day */

            else if (
                currentDay <
                days.length - 1
            ) {

                currentDay++;
                currentPhoto = 0;

            }


            render("next");
        }


        /* =========================
           PREVIOUS
        ========================= */

        function previous() {

            /* Previous photo */

            if (currentPhoto > 0) {

                currentPhoto--;

            }


            /* Previous day */

            else if (currentDay > 0) {

                currentDay--;


                if (
                    days[currentDay].photos.length > 0
                ) {

                    currentPhoto =
                        days[currentDay].photos.length - 1;

                } else {

                    currentPhoto = 0;

                }

            }


            render("prev");
        }


        /* =========================
           KEYBOARD
        ========================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "ArrowRight") {

                    next();

                }

                if (event.key === "ArrowLeft") {

                    previous();

                }

            }
        );


        /* =========================
           TOUCH SWIPE
        ========================= */

        let touchStartX = 0;
        let touchEndX = 0;


        const photoSection =
            document.getElementById(
                "photoSection"
            );


        photoSection.addEventListener(
            "touchstart",
            function (event) {

                touchStartX =
                    event.changedTouches[0].screenX;

            },
            { passive: true }
        );


        photoSection.addEventListener(
            "touchend",
            function (event) {

                touchEndX =
                    event.changedTouches[0].screenX;

                handleSwipe();

            },
            { passive: true }
        );


        function handleSwipe() {

            const difference =
                touchStartX - touchEndX;


            if (Math.abs(difference) < 50) {
                return;
            }


            if (difference > 0) {

                next();

            } else {

                previous();

            }

        }


        /* =========================
           MOUSE DRAG
        ========================= */

        let mouseStartX = 0;
        let mouseDown = false;


        photoSection.addEventListener(
            "mousedown",
            function (event) {

                mouseDown = true;
                mouseStartX = event.clientX;

            }
        );


        photoSection.addEventListener(
            "mouseup",
            function (event) {

                if (!mouseDown) {
                    return;
                }

                mouseDown = false;


                const difference =
                    mouseStartX - event.clientX;


                if (Math.abs(difference) < 50) {
                    return;
                }


                if (difference > 0) {

                    next();

                } else {

                    previous();

                }

            }
        );


        /* =========================
           START
        ========================= */

        render();

    </script>

</body>

</html>
